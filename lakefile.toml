name = "RMTlib"
roots = []
version = "0.1.0"
description = "Lean 4 library for random matrix theory in an extended sense: RSK, tableaux, symmetric functions, Fock space, fermions, Virasoro, Keating–Snaith"
keywords = ["random matrix theory", "Keating-Snaith", "RSK", "Young tableaux", "symmetric functions", "Fock space"]
defaultTargets = ["RMTlib"]
testDriver = "RMTlibTests"
# Mathlib is built for the module system and RMTlib is not (yet): silence the per-import warning.
allowNonModules = true

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
pp.unicode.fun = true
linter.missingDocs = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "31ce06eaadf4a200c0e1407c5f10953cf606b8f8"

# Frames of understanding (no dependencies of its own): RMTlib reads and improves itself through them.
[[require]]
name = "MeaningLib"
git = "https://github.com/DataDotFoundation/MeaningLib"
rev = "ad58fc9b2807c1db80f5cf2fea37903248cbea09"

# `roots = []`: a root defaults to the library name and Lake matches roots by prefix. Projects that
# require RMTlib must not name their own modules `RMTlib*` (RH-Dual's `check_layout.py` enforces it).
[[lean_lib]]
name = "RMTlib"
roots = []
globs = ["RMTlib", "RMTlib.+"]

# Checks (`lake test`): the examples and the axiom audit.
[[lean_lib]]
name = "RMTlibTests"
roots = []
globs = ["RMTlibTests", "RMTlibExamples.+"]
leanOptions = { linter.missingDocs = false }
